<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иллюстрации — превью</title>
<style>
  body {
    margin: 0;
    padding: 32px 24px;
    background: #faf8f5;
    font-family: Georgia, 'Times New Roman', serif;
    color: #5a4632;
  }
  h2 {
    font-size: 15px;
    letter-spacing: 0.18em;
    margin: 36px 0 12px;
    color: #8a6f4d;
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
  .fig { flex: 0 0 auto; width: 132px; text-align: center; }
  .fig img {
    width: 132px;
    height: 132px;
    background: #fff;
    border: 1px solid #ece4d8;
    border-radius: 10px;
    display: block;
  }
  .fig span {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: #8a6f4d;
  }
</style>
</head>
<body>
  <h2>СУРЬЯ (генератор)</h2>
  <div class="row" id="surya"></div>
  <h2>СТОЯЧИЕ</h2>
  <div class="row" id="standing"></div>
  <h2>СИДЯЧИЕ 1</h2>
  <div class="row" id="seated1"></div>
  <h2>СИДЯЧИЕ 2</h2>
  <div class="row" id="seated2"></div>
  <h2>ФИНИШ</h2>
  <div class="row" id="finishing"></div>
  <h2>ВТОРАЯ СЕРИЯ</h2>
  <div class="row" id="intermediate"></div>
<script>
  const SURYA = [
    '01-samasthitih', '02-urdhva-hastasana', '03-uttanasana', '04-ardha-uttanasana',
    '05-chaturanga', '06-urdhva-mukha', '07-adho-mukha', '08-utkatasana',
    '09-virabhadrasana-1', '10-virabhadrasana-1-left',
  ];
  const STANDING = [
    '11-padangusthasana', '12-pada-hastasana',     '13-utthita-trikonasana-a',
    '14-utthita-trikonasana-b', '14b-parivrtta-trikonasana',
    '15-utthita-parshvakonasana-a',
    '16-utthita-parshvakonasana-b', '16b-parivrtta-parshvakonasana',
    '17-prasarita-padottanasana-a',
    '18-prasarita-padottanasana-b', '19-prasarita-padottanasana-c',
    '20-prasarita-padottanasana-d', '21-parshvottanasana',
    '22-utthita-hasta-padangusthasana-a', '23-utthita-hasta-padangusthasana-b',
    '24-ardha-baddha-padmottanasana', '25-virabhadrasana-2',
  ];
  const SEATED1 = [
    '25b-dandasana',
    '26-paschimattanasana-a', '27-paschimattanasana-b', '28-paschimattanasana-c',
    '29-paschimattanasana-d', '30-purvattanasana',
    '31-ardha-baddha-padma-paschimattanasana', '32-triang-mukhaikapada-paschimattanasana',
    '33-janu-sirshasana-a', '34-janu-sirshasana-b', '35-janu-sirshasana-c',
    '36-marichyasana-a', '37-marichyasana-b', '38-marichyasana-c', '39-marichyasana-d',
    '40-navasana-a', '41-navasana-b',
  ];
  const SEATED2 = [
    '42-bhujapidasana', '43-kurmasana', '44-supta-kurmasana', '45-garbha-pindasana',
    '46-kukkutasana', '47-baddha-konasana-a', '48-baddha-konasana-b',
    '49-upavishta-konasana', '50-supta-konasana', '51-supta-padangusthasana',
    '52-ubhaya-padangusthasana', '53-urdhva-mukha-paschimottanasana', '54-setu-bandhasana',
  ];
  const INTERMEDIATE = [
    '70-pasasana', '71-krounchasana', '72-salabhasana-a', '73-salabhasana-b',
    '74-bhekasana', '75-dhanurasana', '76-parsva-dhanurasana', '77-ustrasana',
    '78-laghu-vajrasana', '79-kapotasana', '80-supta-vajrasana', '81-bakasana-a',
    '82-bakasana-b', '83-bharadvajasana', '84-ardha-matsyendrasana',
    '85-eka-pada-sirsasana', '86-dwi-pada-sirsasana', '87-yoga-nidrasana',
    '88-tittibhasana-a', '89-tittibhasana-b', '90-tittibhasana-c',
    '91-pincha-mayurasana', '92-karandavasana', '93-mayurasana', '94-nakrasana',
    '95-vatayanasana', '96-parighasana', '97-gomukhasana-a', '98-gomukhasana-b',
    '99-supta-urdhva-pada-vajrasana', '100-mukta-hasta-sirsasana-a',
    '101-mukta-hasta-sirsasana-b', '102-mukta-hasta-sirsasana-c',
    '103-baddha-hasta-sirsasana-a', '104-baddha-hasta-sirsasana-b',
    '105-baddha-hasta-sirsasana-c', '106-baddha-hasta-sirsasana-d',
  ];
  const FINISHING = [
    '55-urdhva-dhanurasana', '56-salamba-sarvangasana', '57-halasana', '58-karnapidasana',
    '59-urdhva-padmasana', '60-pindasana', '61-matsyasana', '62-uttana-padasana',
    '63-sirsasana', '64-baddha-padmasana', '65-padmasana', '66-utpluthih', '67-savasana',
  ];
  for (const [id, dir, list] of [
    ['surya', 'surya', SURYA],
    ['standing', 'standing', STANDING],
    ['seated1', 'seated1', SEATED1],
    ['seated2', 'seated2', SEATED2],
    ['finishing', 'finishing', FINISHING],
    ['intermediate', 'intermediate', INTERMEDIATE],
  ]) {
    const row = document.getElementById(id);
    for (const f of list) {
      const div = document.createElement('div');
      div.className = 'fig';
      div.innerHTML = `<img src="${dir}/${f}.svg" alt="${f}"><span>${f}</span>`;
      row.appendChild(div);
    }
  }
</script>
</body>
</html>
